<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>პროდუქტების მართვა — ChargerX</title><link rel="icon" type="image/jpeg" href="/fav.jpg"><link rel="stylesheet" href="/assets/site.css?v=2"><link rel="stylesheet" href="/assets/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/assets/supabase-config.js"></script><script defer src="/assets/admin.js?v=4"></script></head><body class="admin-body"><header class="admin-top"><div class="admin-shell"><a class="brand" href="/"><img class="brand-logo" src="/logo.png" alt="ChargerX"></a><nav><small data-admin-email></small><button data-sign-out>გასვლა</button></nav></div></header><main class="admin-shell"><div class="admin-heading"><div><p class="eyebrow"><i></i> მართვის პანელი</p><h1>პროდუქტები</h1></div><button class="button primary" data-new-product>+ ახალი პროდუქტი</button></div><section class="admin-table" data-admin-products></section></main><div class="modal" data-product-modal hidden><form class="modal-card" data-product-form><div class="modal-head"><h2 data-modal-title>ახალი პროდუქტი</h2><button type="button" data-close-modal>×</button></div><div class="form-grid"><div class="field wide"><label>დასახელება</label><input name="name" required></div><div class="field"><label>კატეგორია</label><select name="category"><option value="charger">დამტენი</option><option value="adapter">ადაპტერი</option><option value="accessory">აქსესუარი</option></select></div><div class="field"><label>კატეგორიის წარწერა</label><input name="category_label" required></div><div class="field"><label>ფასი (₾)</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>ძველი ფასი (₾) — ფასდაკლებისთვის</label><input name="old_price" type="number" min="0" step="0.01" placeholder="მაგ. 380"></div><div class="field"><label>ნიშანი</label><input name="badge" placeholder="მაგ. ახალი"></div><div class="field wide"><label>აღწერა</label><textarea name="description"></textarea></div><div class="field wide"><label>თავსებადი მოდელები — მძიმით გამოყავი</label><input name="models" placeholder="Model 3, Model Y"></div><div class="field wide"><label>ფოტო (JPG, PNG ან WebP; მაქს. 5 MB)</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp"></div></div><label class="checkbox"><input name="is_active" type="checkbox" checked> საიტზე გამოჩნდეს</label><p class="form-message" data-message></p><button class="button admin-submit" type="submit">შენახვა</button></form></div></body></html>
