<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Tesla-ს დამტენები, ადაპტერები და აქსესუარები საქართველოში.">
  <title>მაღაზია — ChargerX</title>
  <link rel="icon" href="/logo-mark.png">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/store.css">
  <link rel="stylesheet" href="/assets/legacy-theme.css">
  <script defer src="/assets/site.js"></script>
  <script defer src="/assets/products.js"></script>
  <script defer src="/assets/storefront.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><img src="/logo-mark.png" alt=""><span>CHARGER<b>X</b></span></a>
    <button class="menu-button" aria-expanded="false">მენიუ</button>
    <nav class="main-nav">
      <a class="active" href="/">მაღაზია</a>
      <a href="/chargers/">დამტენები</a>
      <a href="/map/">ნავიგაცია</a>
      <a href="/contact/">კონტაქტი</a>
    </nav>
  </header>
  <main class="shell">
    <section class="page-hero">
      <p class="eyebrow"><i></i> ChargerX shop</p>
      <h1>Tesla-ს აქსესუარები</h1>
      <p>დამტენები, ადაპტერები და პრაქტიკული ნივთები ყოველდღიური მგზავრობისთვის.</p>
    </section>
    <div class="shop-toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">ყველა</button>
        <button class="filter" data-filter="charger">დამტენები</button>
        <button class="filter" data-filter="adapter">ადაპტერები</button>
        <button class="filter" data-filter="accessory">აქსესუარები</button>
      </div>
      <input class="search-input" data-product-search type="search" placeholder="პროდუქტის ძიება…" aria-label="პროდუქტის ძიება">
    </div>
    <section class="product-grid section" data-product-grid style="padding-top:0"></section>
  </main>
  <footer class="site-footer"><div class="shell">
    <a class="brand" href="/"><img src="/logo-mark.png" alt=""><span>CHARGER<b>X</b></span></a>
    <p>Tesla-ს გზამკვლევი საქართველოში.</p>
    <nav><a href="/chargers/">დამტენები</a><a href="/map/">ნავიგაცია</a><a href="/contact/">კონტაქტი</a></nav>
    <small>© 2026 ChargerX</small>
  </div></footer>
</body>
</html>
