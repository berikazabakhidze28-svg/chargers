<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ადმინისტრატორის შესვლა — ChargerX</title>
  <link rel="stylesheet" href="/assets/site.css?v=2">
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/assets/supabase-config.js"></script>
  <script defer src="/assets/admin.js"></script>
</head>
<body class="admin-body">
  <main class="admin-login">
    <form class="auth-card" data-admin-login>
      <a class="brand" href="/"><img class="brand-logo" src="/logo.png" alt="ChargerX"></a>
      <p class="eyebrow"><i></i> ადმინისტრაცია</p>
      <h1>შესვლა</h1>
      <p class="lead">პროდუქტების სამართავად შეიყვანე ადმინისტრატორის მონაცემები.</p>
      <div class="field"><label for="email">ელფოსტა</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">პაროლი</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"></div>
      <p class="form-message" data-message></p>
      <button class="button primary" type="submit">შესვლა</button>
    </form>
  </main>
</body>
</html>
